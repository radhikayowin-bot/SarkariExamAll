# ============================================================
# Site Settings
# ============================================================
title: "SarkariExamAll"
tagline: "Latest Sarkari Job Alerts, Admit Cards, Results & More"
description: "SarkariExamAll publishes timely updates on government jobs, admit cards, results, answer keys, admissions, syllabi, and exam-related notices across India."
url: "https://www.sarkariexamall.com"
baseurl: ""
lang: "en"
timezone: "Asia/Kolkata"

# ============================================================
# Author / Organization
# ============================================================
email: "contact@sarkariexamall.com"

organization:
  name: "SarkariExamAll"
  logo: "/assets/images/logo.png"

# ============================================================
# Social
# ============================================================
social:
  twitter: "itisunique_x"
  facebook: "itisuniqueofficial"
  instagram: "itisuniqueofficial"
  linkedin: "itisuniqueofficial"
  youtube: ""
  rss: "/feed.xml"

# ============================================================
# Build Settings
# ============================================================
markdown: kramdown
highlighter: rouge
permalink: /blog/:categories/:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: true

# ============================================================
# Plugins
# ============================================================
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate-v2
  - jekyll-archives
  - jekyll-include-cache
  - jekyll-last-modified-at
  - jekyll-redirect-from
  - jekyll-toc

# ============================================================
# Pagination (jekyll-paginate-v2)
# ============================================================
pagination:
  enabled: true
  per_page: 9
  permalink: "/page/:num/"
  title: ":title - Page :num"
  limit: 0
  sort_field: "date"
  sort_reverse: true

autopages:
  enabled: true
  categories:
    enabled: true
    layouts:
      - "category.html"
    title: "Category: :cat"
    permalink: "/category/:cat/"
    slugify:
      mode: "default"
      cased: false
  tags:
    enabled: true
    layouts:
      - "tag.html"
    title: "Tag: :tag"
    permalink: "/tag/:tag/"
    slugify:
      mode: "default"
      cased: false
  collections:
    enabled: false

# ============================================================
# Jekyll Archives
# Disabled — jekyll-paginate-v2 autopages handles category/tag
# archives at /category/:name/ and /tag/:name/ instead.
# ============================================================
jekyll-archives:
  enabled: []

# ============================================================
# SEO Tag
# ============================================================
twitter:
  username: "itisunique_x"
  card: summary_large_image

logo: "/assets/images/logo.png"

# ============================================================
# Feed
# ============================================================
feed:
  path: feed.xml
  posts_limit: 20

# Follow.it subscription
# Replace the action URL in newsletter.html / sidebar.html / subscribe_inline.html
# with your Follow.it form action once you've registered your feed at:
# https://follow.it/add-feed
followit:
  feed_url: "/feed.xml"

# ============================================================
# Sass
# ============================================================
sass:
  sass_dir: _sass
  style: compressed
  quiet_deps: true
  silence_deprecations:
    - import
    - global-builtin
    - color-functions

# ============================================================
# Exclude from build
# ============================================================
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .bundle
  - .git
  - README.md
  - "*.sh"
  - "*.log"

# ============================================================
# Include
# ============================================================
include:
  - _pages
  - robots.txt
  - ads.txt
  - .htaccess

# ============================================================
# Front Matter Defaults
# ============================================================
defaults:
  # ----------------------------------------------------------
  # Machine-readable / plain-text files at root
  # Must come FIRST so it takes precedence over the catch-all
  # page default below. Prevents layout injection into .txt,
  # .xml, .json, and similar non-HTML outputs.
  # ----------------------------------------------------------
  - scope:
      path: "*.txt"
    values:
      layout: null
  - scope:
      path: "*.xml"
    values:
      layout: null
  - scope:
      path: "*.json"
    values:
      layout: null

  # ----------------------------------------------------------
  # Posts
  # ----------------------------------------------------------
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "editorial"
      image: "https://placehold.co/1200x675/e5e7eb/334155?text=SarkariExamAll"
      image_alt: "Sarkari exam update graphic"
      featured: false
      toc: false
      comments: false
      share: true

  # ----------------------------------------------------------
  # Pages (catch-all)
  # ----------------------------------------------------------
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
      show_breadcrumbs: true
  - scope:
      path: "_pages"
      type: "pages"
    values:
      layout: "page"
      show_breadcrumbs: true

# ============================================================
# Collections
# Note: _pages is handled via the include: directive above,
# not as a collection, to avoid duplicate output conflicts.
# ============================================================

# ============================================================
# Reading Time (words per minute)
# ============================================================
reading_speed: 200

# ============================================================
# Categories with descriptions (used in templates)
# ============================================================
category_descriptions:
  latest-jobs: "Fresh government job notifications, vacancy details, eligibility, age limit, and important dates."
  admit-card: "Download admit cards and hall tickets for central, state, railway, police, and teaching exams."
  results: "Check latest Sarkari exam results, merit lists, score cards, and selection updates."
  answer-key: "Get official and provisional answer keys, objection dates, and response sheet updates."
  syllabus: "Updated exam syllabus, paper pattern, selection process, and preparation overview."
  admission: "Admission forms, entrance exam notices, counseling schedules, and course updates."
  scholarships: "Scholarship schemes, eligibility, application deadlines, and student support updates."

# ============================================================
# Featured categories shown on homepage
# ============================================================
featured_categories:
  - latest-jobs
  - admit-card
  - results
  - answer-key
